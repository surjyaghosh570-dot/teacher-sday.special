```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Teacher's Day ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --wood:#5a351d;
    --darkwood:#321b10;
    --chalk:#f4f0dc;
    --gold:#ffd86b;
}

body{
    overflow:hidden;
    font-family:Georgia,serif;
    background:#111;
    color:white;
}

/* ================= CLASSROOM ================= */

.classroom{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        linear-gradient(rgba(255,185,90,.08),rgba(0,0,0,.25)),
        #b77b48;
}

/* Wooden floor */

.floor{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:27%;
    background:
        repeating-linear-gradient(
            90deg,
            #6d3d20 0px,
            #7e4928 90px,
            #5c321b 180px
        );
    transform:perspective(500px) rotateX(45deg);
    transform-origin:bottom;
}

/* Wall */

.wall{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:76%;
    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.025) 0 4px,
            transparent 4px 100px
        ),
        linear-gradient(#d8a16b,#bd7d48);
}

/* ================= LIGHT ================= */

.lamp{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:170px;
    height:45px;
    background:#252525;
    border-radius:0 0 90px 90px;
    box-shadow:0 15px 35px rgba(255,200,80,.4);
}

.lamp:after{
    content:"";
    position:absolute;
    top:40px;
    left:-130px;
    width:430px;
    height:350px;
    background:radial-gradient(
        ellipse,
        rgba(255,220,130,.18),
        transparent 70%
    );
    pointer-events:none;
}

/* ================= BOARD ================= */

.board{
    position:absolute;
    top:9%;
    left:8%;
    width:65%;
    height:48%;
    background:#14261d;
    border:18px solid #5a351d;
    border-radius:5px;
    box-shadow:
        0 15px 30px rgba(0,0,0,.5),
        inset 0 0 30px rgba(0,0,0,.5);
}

.board-inner{
    position:absolute;
    inset:0;
    padding:35px;
    color:#f5f2dc;
    text-align:center;
}

.chalk-title{
    font-family:"Comic Sans MS",cursive;
    font-size:clamp(25px,4vw,65px);
    line-height:1.3;
    text-shadow:0 0 5px rgba(255,255,255,.3);
}

.chalk-subtitle{
    margin-top:25px;
    font-family:"Comic Sans MS",cursive;
    font-size:clamp(18px,2.5vw,38px);
    opacity:.9;
}

/* chalk writing animation */

.write{
    width:0;
    overflow:hidden;
    white-space:nowrap;
    border-right:3px solid #eee;
    animation:
        typing 4s steps(38) forwards,
        blink .7s infinite;
}

.write2{
    width:0;
    overflow:hidden;
    white-space:nowrap;
    margin:auto;
    animation:
        typing2 4s steps(30) 4.5s forwards,
        blink .7s infinite;
}

@keyframes typing{
    from{width:0}
    to{width:100%}
}

@keyframes typing2{
    from{width:0}
    to{width:100%}
}

@keyframes blink{
    50%{border-color:transparent}
}

/* ================= SHELF ================= */

.shelf{
    position:absolute;
    right:5%;
    top:14%;
    width:22%;
    height:42%;
    background:#63391f;
    border:8px solid #3b2114;
    box-shadow:0 15px 30px rgba(0,0,0,.4);
}

.shelf-row{
    height:50%;
    border-bottom:8px solid #3b2114;
    display:flex;
    justify-content:space-evenly;
    align-items:flex-end;
    padding:10px;
}

/* Books */

.book{
    width:18%;
    height:75%;
    border-radius:3px 3px 0 0;
    box-shadow:3px 3px 7px #24140c;
}

.book:nth-child(1){background:#7d2222}
.book:nth-child(2){background:#244e67}
.book:nth-child(3){background:#b5822c}
.book:nth-child(4){background:#49356b}
.book:nth-child(5){background:#315c43}

/* Report card */

.report-card{
    position:absolute;
    width:55px;
    height:75px;
    background:#fff4c9;
    right:20px;
    top:20px;
    transform:rotate(5deg);
    cursor:pointer;
    color:#222;
    border:3px solid #e3b83f;
    box-shadow:
        0 0 12px #ffd75a,
        0 0 30px rgba(255,210,50,.7);
    animation:shine 1.6s infinite alternate;
    z-index:5;
}

.report-card span{
    position:absolute;
    font-size:7px;
    width:100%;
    text-align:center;
    top:28px;
    font-weight:bold;
}

@keyframes shine{
    from{box-shadow:0 0 8px #ffd75a}
    to{box-shadow:0 0 30px #fff1a2,0 0 60px #ffc928}
}

/* ================= DESK ================= */

.desk{
    position:absolute;
    bottom:18%;
    left:18%;
    width:45%;
    height:18%;
    background:linear-gradient(#8b512c,#60351d);
    border-radius:10px;
    box-shadow:0 20px 25px rgba(0,0,0,.45);
}

.desk-top{
    position:absolute;
    top:-20px;
    left:-5%;
    width:110%;
    height:30px;
    background:#9c5e34;
    border-radius:7px;
}

.desk-leg{
    position:absolute;
    top:20px;
    width:25px;
    height:150px;
    background:#4d2917;
}

.leg1{left:12%}
.leg2{right:12%}

/* drawer */

.drawer{
    position:absolute;
    left:50%;
    top:20px;
    transform:translateX(-50%);
    width:130px;
    height:55px;
    background:#4a2716;
    border:3px solid #2d180e;
    cursor:pointer;
}

.drawer:after{
    content:"";
    position:absolute;
    width:35px;
    height:7px;
    background:#c58c45;
    border-radius:10px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* ================= CHAIR ================= */

.chair{
    position:absolute;
    bottom:14%;
    right:17%;
    width:130px;
    height:150px;
}

.chair-back{
    width:100px;
    height:90px;
    background:#542b18;
    border-radius:10px;
    margin:auto;
}

.chair-seat{
    width:130px;
    height:25px;
    background:#6f3a20;
    margin-top:10px;
    border-radius:5px;
}

.chair-leg{
    position:absolute;
    top:115px;
    width:12px;
    height:80px;
    background:#351b10;
}

.cl1{left:20px}
.cl2{right:20px}

/* ================= CLOCK ================= */

.clock{
    position:absolute;
    right:8%;
    top:62%;
    width:100px;
    height:100px;
    background:#f1dfae;
    border:8px solid #4b2a18;
    border-radius:50%;
    cursor:pointer;
    box-shadow:0 8px 15px rgba(0,0,0,.4);
}

.hand{
    position:absolute;
    width:4px;
    height:35px;
    background:#222;
    left:50%;
    top:15px;
    transform-origin:bottom;
    transform:translateX(-50%) rotate(35deg);
}

.hand2{
    height:28px;
    transform:translateX(-50%) rotate(130deg);
}

/* ================= BELL ================= */

.bell{
    position:absolute;
    left:7%;
    top:63%;
    font-size:70px;
    cursor:pointer;
    filter:drop-shadow(5px 8px 5px rgba(0,0,0,.4));
    transition:.2s;
}

.bell:hover{
    transform:scale(1.12) rotate(-5deg);
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.modal.show{
    display:flex;
}

.paper{
    position:relative;
    width:min(600px,95vw);
    max-height:90vh;
    overflow:auto;
    padding:40px;
    background:
        linear-gradient(#fffdf0,#f6e9bf);
    color:#342314;
    border:8px solid #a66a32;
    box-shadow:0 20px 60px rgba(0,0,0,.7);
    animation:openPaper .5s ease;
}

@keyframes openPaper{
    from{
        transform:scale(.5) rotate(-5deg);
        opacity:0;
    }
    to{
        transform:scale(1) rotate(0);
        opacity:1;
    }
}

.close{
    position:absolute;
    right:15px;
    top:10px;
    font-size:30px;
    cursor:pointer;
    color:#542b18;
}

.paper h1{
    text-align:center;
    margin-bottom:20px;
    font-size:clamp(25px,5vw,40px);
}

.paper p{
    font-size:18px;
    line-height:1.7;
    margin:12px 0;
}

.score{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px dashed #9a7346;
}

.stars{
    color:#d49700;
    letter-spacing:3px;
}

.final-grade{
    margin-top:20px;
    padding:15px;
    text-align:center;
    background:#efd278;
    font-size:25px;
    font-weight:bold;
}

/* ================= WELCOME ================= */

.welcome{
    position:fixed;
    inset:0;
    z-index:200;
    background:
        radial-gradient(circle at center,rgba(255,210,120,.12),transparent 45%),
        #15100d;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    transition:1s;
}

.welcome.hide{
    opacity:0;
    pointer-events:none;
}

.welcome-box{
    max-width:700px;
}

.welcome h1{
    font-size:clamp(35px,7vw,80px);
    margin-bottom:20px;
}

.welcome p{
    font-size:20px;
    opacity:.8;
    margin-bottom:35px;
}

.enter{
    padding:16px 35px;
    border:2px solid #e7bd62;
    background:transparent;
    color:#ffe3a1;
    font-size:20px;
    border-radius:50px;
    cursor:pointer;
    transition:.3s;
}

.enter:hover{
    background:#e7bd62;
    color:#24170e;
    transform:scale(1.05);
}

/* ================= MESSAGE ================= */

.toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%) translateY(100px);
    background:rgba(20,15,10,.92);
    border:1px solid #d5aa55;
    padding:15px 25px;
    border-radius:50px;
    z-index:150;
    opacity:0;
    transition:.5s;
    text-align:center;
    max-width:90%;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* ================= CONFETTI ================= */

.confetti{
    position:fixed;
    width:8px;
    height:14px;
    top:-20px;
    z-index:300;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

    .board{
        left:3%;
        top:8%;
        width:94%;
        height:40%;
        border-width:10px;
    }

    .board-inner{
        padding:20px 10px;
    }

    .shelf{
        display:none;
    }

    .desk{
        left:10%;
        width:80%;
        bottom:18%;
    }

    .chair{
        display:none;
    }

    .clock{
        width:70px;
        height:70px;
        right:5%;
        top:51%;
    }

    .bell{
        left:4%;
        top:50%;
        font-size:50px;
    }

    .floor{
        height:25%;
    }

    .paper{
        padding:25px 18px;
    }
}
</style>
</head>

<body>

<!-- WELCOME SCREEN -->

<div class="welcome" id="welcome">

    <div class="welcome-box">

        <div style="font-size:70px;">📚</div>

        <h1>Welcome, Teacher ❤️</h1>

        <p>
            A little classroom has been prepared especially for you.
            <br>
            Explore it. There are a few surprises waiting.
        </p>

        <button class="enter" onclick="enterClassroom()">
            Enter Your Classroom →
        </button>

    </div>

</div>


<!-- CLASSROOM -->

<div class="classroom">

    <div class="wall"></div>

    <div class="floor"></div>

    <div class="lamp"></div>


    <!-- BLACKBOARD -->

    <div class="board">

        <div class="board-inner">

            <div class="chalk-title">

                <div class="write">
                    Happy Teacher's Day ❤️
                </div>

            </div>

            <div class="chalk-subtitle">

                <div class="write2">
                    To The Best Teacher Ever ✨
                </div>

            </div>

        </div>

    </div>


    <!-- BOOK SHELF -->

    <div class="shelf">

        <div class="shelf-row">

            <div class="book"></div>
            <div class="book"></div>

            <!-- REPORT CARD -->

            <div
                class="report-card"
                onclick="openReport()"
                title="Click me!"
            >
                <span>REPORT<br>CARD</span>
            </div>

            <div class="book"></div>
            <div class="book"></div>

        </div>

        <div class="shelf-row">

            <div class="book"></div>
            <div class="book"></div>
            <div class="book"></div>
            <div class="book"></div>

        </div>

    </div>


    <!-- DESK -->

    <div class="desk">

        <div class="desk-top"></div>

        <div
            class="drawer"
            onclick="openLetter()"
            title="There's something inside..."
        ></div>

        <div class="desk-leg leg1"></div>
        <div class="desk-leg leg2"></div>

    </div>


    <!-- CHAIR -->

    <div class="chair">

        <div class="chair-back"></div>
        <div class="chair-seat"></div>

        <div class="chair-leg cl1"></div>
        <div class="chair-leg cl2"></div>

    </div>


    <!-- BELL -->

    <div
        class="bell"
        onclick="ringBell()"
        title="Ring the school bell"
    >
        🔔
    </div>


    <!-- CLOCK -->

    <div
        class="clock"
        onclick="clockMessage()"
        title="Click the clock"
    >

        <div class="hand"></div>
        <div class="hand hand2"></div>

    </div>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

    <div class="paper">

        <div class="close" onclick="closeModal()">×</div>

        <div id="modalContent"></div>

    </div>

</div>


<!-- TOAST -->

<div class="toast" id="toast"></div>


<script>

/* ================= WELCOME ================= */

function enterClassroom(){

    document.getElementById("welcome").classList.add("hide");

    setTimeout(()=>{
        showToast(
            "Welcome to your classroom ❤️ Explore the objects around you!"
        );
    },1200);
}


/* ================= MODAL ================= */

function openModal(content){

    document.getElementById("modalContent").innerHTML = content;

    document.getElementById("modal").classList.add("show");

}

function closeModal(){

    document.getElementById("modal").classList.remove("show");

}


/* ================= REPORT CARD ================= */

function openReport(){

    openModal(`

        <h1>🏆 Teacher Report Card</h1>

        <p style="text-align:center;">
            <i>Official Evaluation of the World's Best Teacher</i>
        </p>

        <div class="score">
            <span>Knowledge</span>
            <span class="stars">★★★★★</span>
        </div>

        <div class="score">
            <span>Patience</span>
            <span class="stars">★★★★★</span>
        </div>

        <div class="score">
            <span>Kindness</span>
            <span class="stars">★★★★★</span>
        </div>

        <div class="score">
            <span>Motivation</span>
            <span class="stars">★★★★★</span>
        </div>

        <div class="score">
            <span>Making Students Smile</span>
            <span class="stars">★★★★★</span>
        </div>

        <div class="score">
            <span>Changing Lives</span>
            <span class="stars">∞</span>
        </div>

        <div class="final-grade">
            FINAL GRADE: A+++++ ❤️
        </div>

        <p style="text-align:center;margin-top:25px;">
            “There is no score high enough to measure
            everything you have done for us.”
        </p>

    `);

}


/* ================= DRAWER ================= */

function openLetter(){

    openModal(`

        <h1>💌 A Letter For You</h1>

        <p>
            Dear Teacher,
        </p>

        <p>
            You didn't just teach us what's written in books.
            You taught us how to think, how to believe in ourselves,
            and how to keep going when things get difficult.
        </p>

        <p>
            Some lessons disappear from notebooks.
            The lessons you gave us won't.
        </p>

        <p>
            Thank you for every explanation,
            every correction, every bit of patience,
            and every time you believed in us.
        </p>

        <p style="text-align:center;font-size:24px;">
            ❤️ Thank You For Everything ❤️
        </p>

    `);

}


/* ================= CLOCK ================= */

function clockMessage(){

    openModal(`

        <h1>⏰ Time</h1>

        <p style="text-align:center;font-size:25px;">

            Time keeps moving...

        </p>

        <p style="text-align:center;">

            Years will pass.
            <br><br>

            Classrooms will change.
            <br><br>

            Students will grow up.

        </p>

        <p style="text-align:center;font-size:23px;">

            But the lessons you gave us
            will stay forever. ❤️

        </p>

    `);

}


/* ================= BELL ================= */

function ringBell(){

    playBell();

    showToast(
        "🔔 CLASS DISMISSED — But your lessons stay with us forever."
    );

}


/* ================= SOUND ================= */

function playBell(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx = new AudioContext();

        const osc = ctx.createOscillator();

        const gain = ctx.createGain();

        osc.type = "sine";

        osc.frequency.setValueAtTime(
            650,
            ctx.currentTime
        );

        osc.frequency.exponentialRampToValueAtTime(
            300,
            ctx.currentTime + .8
        );

        gain.gain.setValueAtTime(
            .4,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + 1.5
        );

        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start();

        osc.stop(ctx.currentTime + 1.5);

    }catch(e){}

}


/* ================= TOAST ================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.innerHTML = message;

    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },4500);

}


/* ================= CLOSE MODAL OUTSIDE ================= */

document
.getElementById("modal")
.addEventListener("click",function(e){

    if(e.target === this){

        closeModal();

    }

});


/* ================= FINAL SURPRISE ================= */

let discovered = 0;

document.querySelector(".report-card")
.addEventListener("click",()=>{

    discovered++;

    if(discovered >= 1){

        setTimeout(()=>{

            showToast(
                "✨ You found the Teacher Report Card!"
            );

        },500);

    }

});


/* ================= KONAMI-LIKE EASTER EGG ================= */

let clicks = 0;

document.querySelector(".board")
.addEventListener("click",()=>{

    clicks++;

    if(clicks === 5){

        createConfetti();

        openModal(`

            <h1>🌟 One Last Surprise</h1>

            <p style="text-align:center;font-size:25px;">

                THANK YOU

            </p>

            <p style="text-align:center;">

                For teaching.
                <br>
                For believing.
                <br>
                For inspiring.

            </p>

            <div class="final-grade">

                YOU ARE MORE THAN A TEACHER. ❤️

            </div>

            <p style="text-align:center;margin-top:25px;">

                Happy Teacher's Day!

            </p>

        `);

        clicks = 0;

    }

});


/* ================= CONFETTI ================= */

function createConfetti(){

    for(let i=0;i<100;i++){

        const c =
            document.createElement("div");

        c.className = "confetti";

        c.style.left =
            Math.random()*100 + "vw";

        c.style.animationDuration =
            (2 + Math.random()*3) + "s";

        c.style.background =
            `hsl(${Math.random()*360},80%,65%)`;

        c.style.transform =
            `rotate(${Math.random()*360}deg)`;

        document.body.appendChild(c);

        setTimeout(()=>{
            c.remove();
        },6000);

    }

}

</script>

</body>
</html>
```
